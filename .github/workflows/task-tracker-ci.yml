name: CI

on:
  push:
    branches: [master, task-tracker]
    paths:
      - 'task-tracker/**'
      - '.github/workflows/task-tracker-ci.yml'
  pull_request:
    branches: [master]
    paths:
      - 'task-tracker/**'
      - '.github/workflows/task-tracker-ci.yml'

defaults:
  run:
    working-directory: task-tracker

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: task-tracker/go.sum

      - name: Download dependencies
        run: go mod download && go mod verify

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Check coverage
        run: go tool cover -func=coverage.out

  build:
    name: Build Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: task-tracker
          push: false
          tags: task-tracker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
