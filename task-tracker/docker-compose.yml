services:
  task-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    image: task-tracker:latest
    container_name: task-tracker
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
        reservations:
          cpus: "0.25"
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    read_only: true
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
